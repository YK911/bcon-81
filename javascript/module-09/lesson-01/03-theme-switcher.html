<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThemeSwitcher</title>
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="white"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="black"
    />
    <!-- <link rel="stylesheet" href="" media="(prefers-color-scheme: )" /> -->
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/theme-switcher.css" />
  </head>
  <body class="page">
    <header class="header">
      <div class="container">
        <a href="">Logo</a>

        <button class="sidebar-btn-open js-sidebar-btn" data-open type="button">
          Open
        </button>
        <label class="toggler">
          <input
            class="toggler-control js-toggler-control"
            type="checkbox"
            name="themeSwitcher"
            id="themeSwitcher"
            value="light"
          />
        </label>
      </div>
    </header>

    <aside class="sidebar js-sidebar">
      <button class="sidebar-btn js-sidebar-btn" data-close>x</button>
      Navigation
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="#">Link 1</a>
        <a class="sidebar-link" href="#">Link 2</a>
        <a class="sidebar-link" href="#">Link 3</a>
        <a class="sidebar-link" href="#">Link 4</a>
        <a class="sidebar-link" href="#">Link 5</a>
      </nav>
    </aside>

    <main class="main">
      <div class="container">
        <h1>Some Content</h1>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>Made with ❤️</p>
      </div>
    </footer>

    <script type="module" src="./js/03-theme-switcher.js"></script>
  </body>
</html>
