<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variables and types</title>
    <style>
      .notification {
        max-width: 200px;
        margin: 0 auto;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid tomato;
        background-color: rgba(255, 0, 0, 0.303);
        font-family: sans-serif;
        font-size: 20px;

        a {
          display: block;
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <button type="button">Click me</button>

    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
      Instagram
    </a>

    <input type="text" value="JavaScript is awesome!" id="testText" />
    <input type="text" value="5" id="testNumber" />

    <p
      style="
        max-width: 400px;
        border: 2px solid red;
        border-radius: 16px;
        padding: 10px 20px;
        margin: 50px auto;
      "
      id="text"
    >
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Eum, ipsum?
    </p>

    <p class="notification">
      <span class="notification-content" id="notificationContent">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vitae tenetur
        totam beatae quibusdam quia enim amet aliquid? Sed, accusamus dicta?
      </span>

      <a href="">Read more</a>
    </p>
