<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Method</title>
  </head>
  <body>
    <section class="py-5">
      <div class="container">
        <form name="commentForm">
          <div class="mb-3">
            <label for="nickname" class="form-label">Nickname</label>
            <input
              class="form-control"
              type="text"
              id="nickname"
              name="userId"
              data-user-id="111"
              placeholder="Mango"
            />
          </div>
          <div class="mb-3">
            <label for="comment" class="form-label">Comment</label>
            <textarea
              class="form-control"
              id="comment"
              name="body"
              rows="3"
              placeholder="Type your comment..."
            ></textarea>
          </div>
          <div>
            <button class="btn btn-primary" type="submit">Send</button>
          </div>
        </form>

        <h3 class="mt-3">Comments</h3>
        <ul class="commnets-list js-comment-list"></ul>
      </div>
    </section>

    <div
      class="toast-container p-3 bottom-0 end-0 js-toast-container"
      id="toastPlacement"
      data-original-class="toast-container p-3"
    >
      <div class="toast fade js-toast">
        <div class="toast-body"></div>
      </div>
    </div>
    <script type="module" src="./src/js/04-post.js"></script>
  </body>
</html>
